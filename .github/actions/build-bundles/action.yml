name: Build bundles
description: >-
  Create the uv environment, build every PyInstaller spec in packaging/, and
  write one zip per bundle into artefacts/. Call this from a workflow on a
  runner of the target platform - PyInstaller cannot cross-compile.

inputs:
  platform:
    description: Platform suffix for the artefact names, for example linux-x64.
    required: true
  python-version:
    description: Python version used for the build.
    required: false
    default: "3.12"
  pyinstaller-version:
    description: >-
      Pinned PyInstaller version. Pin it so a release cannot change a good
      build silently; upgrade it deliberately.
    required: false
    default: "6.22.3"

runs:
  using: composite
  steps:
    # Exact version on purpose: after v7 this action no longer publishes moving
    # major tags (v7 itself is still node20). Bump the version explicitly.
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
        cache-dependency-glob: uv.lock

    - name: Sync environment
      shell: bash
      run: uv sync --locked

    - name: Build bundles
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        PYINSTALLER_VERSION: ${{ inputs.pyinstaller-version }}
      run: |
        set -euo pipefail
        mkdir -p artefacts
        for spec in packaging/*.spec; do
          name="$(basename "$spec" .spec)"
          echo "::group::building $name"
          uv run --with "pyinstaller==${PYINSTALLER_VERSION}" pyinstaller \
            --noconfirm --clean \
            --distpath dist/pyinstaller \
            --workpath build/pyinstaller \
            "$spec"
          echo "::endgroup::"
          uv run python -c \
            "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist/pyinstaller', sys.argv[2])" \
            "artefacts/${name}-${PLATFORM}" "$name"
        done
        ls -lh artefacts

    # Installed *after* the build on purpose: the bundles must not embed the
    # system GL/EGL stack (GLVND picks the vendor driver at run time), but the
    # GitHub runner is a server image without it, so the smoke test needs it.
    # Qt6Gui links libEGL.so.1 and libGL.so.1 directly - even offscreen.
    - name: Install the Linux Qt runtime libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
          libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
          libxkbcommon-x11-0 libxi6 libxrender1 libsm6 libice6 \
          fonts-dejavu-core
