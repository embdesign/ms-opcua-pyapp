name: Release

# Push a tag such as v0.1.0 to build both platform bundles and attach them to a
# GitHub Release. The tag must match `version` in pyproject.toml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs-on: ubuntu-22.04
          - platform: windows-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-bundles
        with:
          platform: ${{ matrix.platform }}

      - name: Smoke test the exporter
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${RUNNER_OS:-}" = "Windows" ]; then exe=".exe"; fi
          ./dist/pyinstaller/opcua-export/opcua-export${exe} --version
          ./dist/pyinstaller/opcua-export/opcua-export${exe} --help > /dev/null

      - name: GUI must start and stay up (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          ./dist/pyinstaller/opcua-explorer/opcua-explorer &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the bundled GUI exited during start-up"
            echo "--- unresolved shared libraries ---"
            ldd dist/pyinstaller/opcua-explorer/_internal/libQt6Gui.so.6 2>/dev/null | grep "not found" || true
            wait "$pid"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: opcua-explorer-${{ matrix.platform }}
          path: artefacts/*.zip
          if-no-files-found: error

  release:
    name: Attach bundles to the release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the project version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
