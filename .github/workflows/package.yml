name: Package

# Builds the standalone Windows and Linux bundles on every change and keeps them
# as downloadable workflow artefacts. Releases are produced by release.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: a bundle built on 24.04 (glibc 2.39) would not
          # start on Debian 12 (glibc 2.36).
          - platform: linux-x64
            runs-on: ubuntu-22.04
          - platform: windows-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-bundles
        with:
          platform: ${{ matrix.platform }}

      - name: Smoke test the console bundles
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${RUNNER_OS:-}" = "Windows" ]; then exe=".exe"; fi
          ./dist/pyinstaller/opcua-export/opcua-export${exe} --version
          ./dist/pyinstaller/opcua-export/opcua-export${exe} --help > /dev/null
          ./dist/pyinstaller/opcua-compare/opcua-compare${exe} --version
          ./dist/pyinstaller/opcua-compare/opcua-compare${exe} --help > /dev/null
          # Offline comparison: the committed sample against itself must exit 0, which proves
          # the frozen build can load a JSON export and run the comparison without a server.
          ./dist/pyinstaller/opcua-compare/opcua-compare${exe} \
            --reference-file examples/demo-address-space.json \
            --candidate-file examples/demo-address-space.json --quiet > /dev/null

      - name: GUI must start and stay up (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          ./dist/pyinstaller/opcua-explorer/opcua-explorer &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the bundled GUI exited during start-up"
            echo "--- unresolved shared libraries ---"
            ldd dist/pyinstaller/opcua-explorer/_internal/libQt6Gui.so.6 2>/dev/null | grep "not found" || true
            wait "$pid"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: opcua-explorer-${{ matrix.platform }}
          path: artefacts/*.zip
          if-no-files-found: error
          retention-days: 30
