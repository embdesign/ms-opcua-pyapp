[project]
name = "opcua-explorer"
version = "0.1.1"
description = "Desktop OPC UA client: browse, download, export, monitor, write, call methods and run operator sequences"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "OPC UA Explorer contributors" }]
keywords = ["opcua", "industrial", "asyncua", "pyside6", "address-space"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
]

# Runtime dependencies are pinned to the exact versions this project was
# verified against; see docs/api-verification.md.
dependencies = [
    "asyncua==2.1.0",
    # 6.12.0 crashes with "Fatal Python error: none_dealloc: deallocating None" after a few
    # thousand QTreeWidgetItem rows (Shiboken refcount regression). 6.11.3 is verified by the
    # reproducer in tests/integration/test_pyside_stability.py - do not upgrade without it.
    "PySide6==6.11.3",
]

[project.optional-dependencies]
# Optional XSD validation of exported NodeSet2 files. Without it the exporter
# still parses its own output and reports that schema validation was skipped.
validation = ["lxml>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.0",
    # Optional parallel runs: `uv run pytest -n auto --dist loadscope`.
    # Module-scoped `qapp` and free-port demo servers make loadscope safe.
    "pytest-xdist>=3.6",
    "lxml>=5.0",
    # tests/support.py creates throw-away certificates; do not rely on asyncua's
    # transitive dependency for it.
    "cryptography>=50",
]

[project.scripts]
opcua-explorer = "opcua_explorer.gui.app:main"
opcua-demo-server = "opcua_explorer.demo.demo_server:main"
# Headless address-space export (Qt-free, same services as the GUI Export tab).
opcua-export = "opcua_explorer.cli:main"
# Headless comparison of two address spaces (Qt-free).
opcua-compare = "opcua_explorer.cli_compare:main"
# Headless read of one or more node attributes (Qt-free).
opcua-read = "opcua_explorer.cli_read:main"
# Headless live data-change monitor (Qt-free).
opcua-monitor = "opcua_explorer.cli_monitor:main"
# Headless raw-history read (Qt-free).
opcua-history = "opcua_explorer.cli_history:main"
# Headless run of an operator-written sequence document (Qt-free).
opcua-run-sequence = "opcua_explorer.cli_sequence:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opcua_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Test cases are plain functions. Without this, pytest would try to collect the
# domain dataclasses TestConfig/TestCheck/TestRun/TestProgress as test classes.
python_classes = ["*Suite"]
filterwarnings = [
    "error::DeprecationWarning:opcua_explorer.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
